name: Patch v33

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/patch-v33.py
      - run: |
          git config user.name "Kevin"
          git config user.email "kevinvanarnam@gmail.com"
          git add app.js styles.css index.html service-worker.js research/_TEMPLATE.md research/HOUSE_STANDARDS.md research/KPV_Compound_Research.md
          git commit -m "KPV two-tier research (Site Safety Coordinator) + Go deeper divider. Cache-bust v63."
          git push origin HEAD:main
