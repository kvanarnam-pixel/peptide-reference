name: One-shot Retatrutide and TB-500 Tier 1 fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-retatb-tier1-fix.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact research-doc fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          reta_path = Path('research/Retatrutide_Compound_Research.md')
          tb_path = Path('research/TB-500_Compound_Research.md')

          reta = reta_path.read_text()
          tb = tb_path.read_text()

          old_voice = "One French national-registry study (Bezin et al.) found a real, if imperfectly controlled, signal specifically for cancer diagnosed at 1–3 years of use — worth knowing about, not worth treating as settled in either direction."
          new_voice = "One large French national-registry study found a real, if imperfectly controlled, signal specifically for cancer diagnosed at 1–3 years of use — worth knowing about, not worth treating as settled in either direction."
          if reta.count(old_voice) != 1:
              raise SystemExit(f'Retatrutide voice target count = {reta.count(old_voice)}, expected 1')
          reta = reta.replace(old_voice, new_voice, 1)

          reta_insight = '''## One genuine non-obvious insight

The third receptor gets marketed as "even more appetite suppression," and that's the wrong mental model. GLP-1 and GIP both work upstream of intake — less food goes in. Glucagon works downstream of intake, in a different organ, through a different intracellular pathway that has nothing to do with satiety signaling. That's why the liver-fat data is disproportionate to what the weight loss alone would predict, and it's also a plausible reason retatrutide's added efficacy over dual-agonists doesn't scale with proportionally worse GI side effects the way you'd expect from "just a stronger GLP-1 drug" — a meaningful share of the extra effect isn't running through the same gastric-slowing pathway that drives nausea in GLP-1-heavy drugs. The genuine insight isn't "more receptors, more effect." It's that one of the three receptors isn't playing the same game as the other two.
'''

          if reta.count(reta_insight) != 1:
              raise SystemExit(f'Retatrutide insight block count = {reta.count(reta_insight)}, expected 1')
          reta = reta.replace(reta_insight, '', 1)

          reta_anchor = '''
---

*— Everything below this line is the technical deep dive: mechanism, audit trail, and evidence sourcing. Not written to be read aloud. —*

---

### — Technical Deep Dive divider —'''
          if reta.count(reta_anchor) != 1:
              raise SystemExit(f'Retatrutide divider anchor count = {reta.count(reta_anchor)}, expected 1')
          reta = reta.replace(reta_anchor, '\n\n' + reta_insight.rstrip() + '\n' + reta_anchor, 1)

          tb_insight = '''## One genuine non-obvious insight

The most quietly important finding in this file isn't a mechanism confirmation — it's a 2024 study suggesting the vial may not be the final worker. Injected TB-500 (Ac-LKKTETQ) gets metabolized fairly quickly, and when researchers actually tested the biological activity of the breakdown products against the parent molecule, one specific metabolite — Ac-LKKTE — carried the measurable wound-healing effect, not the intact peptide as sold.

That reframes the whole compound's story in a useful way. Most peptide-community explanations treat "TB-500 heals tissue" as a direct, one-step claim: inject the molecule, the molecule does the work. This finding suggests a more accurate version might be a two-step process: inject the molecule, the body breaks it down, and one of those breakdown products is where the activity actually lives. That's not a reason to distrust TB-500's practical track record — the same downstream effect still happens either way — but it changes what "TB-500" honestly refers to biologically, and it's a good example of why fragment-level pharmacology deserves more scrutiny than it usually gets in this space.
'''

          if tb.count(tb_insight) != 1:
              raise SystemExit(f'TB-500 insight block count = {tb.count(tb_insight)}, expected 1')
          tb = tb.replace(tb_insight, '', 1)

          tb_anchor = '''
---

*Everything below this line is the technical deep dive: mechanism, audit trail, and evidence sourcing. Not written to be read aloud.*

---

### — Technical Deep Dive divider —'''
          if tb.count(tb_anchor) != 1:
              raise SystemExit(f'TB-500 divider anchor count = {tb.count(tb_anchor)}, expected 1')
          tb = tb.replace(tb_anchor, '\n\n' + tb_insight.rstrip() + '\n' + tb_anchor, 1)

          reta_path.write_text(reta)
          tb_path.write_text(tb)
          PY

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git rm .github/workflows/one-shot-retatb-tier1-fix.yml
          git add research/Retatrutide_Compound_Research.md research/TB-500_Compound_Research.md
          git commit -m "Fix Retatrutide and TB-500 Tier 1 placement"
          git push origin main

# trigger
