name: Patch v30

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/patch-v30.py
      - run: |
          git config user.name "Kevin"
          git config user.email "kevinvanarnam@gmail.com"
          git add app.js index.html service-worker.js
          git commit -m "Keep authored chips; structured dose overlay only for generic cards. Cache-bust v30."
          git push origin HEAD:main
