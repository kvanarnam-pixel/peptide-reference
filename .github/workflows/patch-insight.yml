name: Patch insight move

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/patch-insight.py
      - run: |
          git config user.name "Kevin"
          git config user.email "kevinvanarnam@gmail.com"
          git add research/_TEMPLATE.md research/NAD+_Compound_Research.md research/BPC-157_Compound_Research.md research/ARA-290_Compound_Research.md research/MOTS-c_Compound_Research.md research/KPV_Compound_Research.md
          git commit -m "Move One genuine non-obvious insight into Tier 1 (NAD+, BPC-157, ARA-290, MOTS-c, KPV + template)."
          git push origin HEAD:main
